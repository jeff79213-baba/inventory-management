<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存管理系統</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <nav class="navbar">
    <a href="#" class="navbar-brand">庫存管理系統</a>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="inventory" onclick="switchMode('inventory')">庫存列表</button>
      <button class="mode-btn" data-mode="settings" onclick="switchMode('settings')">後台設定</button>
    </div>
  </nav>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="searchInput" class="form-input" placeholder="搜尋..." oninput="onSearch(this.value)">
    </div>

    <div id="capsuleArea" class="capsule-area"></div>

    <div id="fieldSelectArea" class="field-select-area" style="display:none"></div>

    <div id="inputArea" class="input-area" style="display:none"></div>

    <div id="settingsArea"></div>

    <div id="tableArea" class="table-area" style="display:none"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/db.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/backup.js?v=3"></script>
</body>
</html>
