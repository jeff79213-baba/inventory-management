<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存管理 - 後台設定</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">庫存管理系統</a>
    <div class="navbar-links">
      <a href="index.html">庫存列表</a>
      <a href="settings.html"><strong>後台設定</strong></a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">欄位配置器</h2>
        <button class="btn btn-primary" onclick="addField()">+ 新增欄位</button>
      </div>
      <p class="help-text">設定品項的屬性欄位。新增後，輸入品項時會依序顯示這些欄位供勾選或輸入。</p>
      
      <div id="fieldsList" class="fields-list">
        <!-- 動態產生欄位設定 -->
      </div>

      <div class="save-bar">
        <button class="btn btn-primary btn-lg" onclick="saveFields()">儲存設定</button>
        <span id="saveStatus" class="save-status"></span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
